[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-mantto-esp32-langgraph"
version = "0.1.0"
description = "LangGraph deployment layer for ERP Mantto ESP32"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["langgraph_app*"]
