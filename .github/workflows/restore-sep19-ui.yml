name: Restore Sep19 UI contract

on:
  push:
    branches:
      - fix/restore-sep19-ui-mdns-pcu

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-sep19-ui-mdns-pcu
          fetch-depth: 0

      - name: Restore recovered UI labels and lock contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          source_paths = [Path("platformio/src/panel_4848s040/main.cpp"), Path("src/main.cpp")]
          for path in source_paths:
              text = path.read_text(encoding="utf-8")
              if "BACKEND DISPONIBLE" not in text or "PROBAR BACKEND" not in text:
                  raise SystemExit(f"Expected integrated labels not found in {path}")
              text = text.replace("BACKEND DISPONIBLE", "WSL DISPONIBLE")
              text = text.replace("PROBAR BACKEND", "PROBAR WSL")
              for required in ("WSL DISPONIBLE", "PROBAR WSL", "ENVIAR 3C", "EDITAR ORDEN 3C", "CANCELAR", "3c-backend.local"):
                  if required not in text:
                      raise SystemExit(f"Missing {required!r} after restoration in {path}")
              path.write_text(text, encoding="utf-8")
          def git_blob_sha(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          manifest_path = Path("firmware/firmware-sync.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for path in source_paths:
              manifest["git_blob_sha1"][path.as_posix()] = git_blob_sha(path)
          manifest["imported_from"]["note"] = "Integrated production mDNS/NVS discovery into the ERP repository firmware while preserving the recovered 2026-09-19 WSL UI labels and keyboard. ERP main is authoritative for deployment."
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          lines = [
              "from pathlib import Path",
              "",
              "PRIMARY = Path('platformio/src/panel_4848s040/main.cpp').read_text(encoding='utf-8')",
              "MIRROR = Path('src/main.cpp').read_text(encoding='utf-8')",
              "KEYBOARD = Path('include/virtual_keyboard.h').read_text(encoding='utf-8')",
              "assert PRIMARY == MIRROR, 'Firmware mirror drift'",
              "for token in ('WSL DISPONIBLE', 'PROBAR WSL', 'ENVIAR 3C', 'EDITAR ORDEN 3C', 'CANCELAR', '3c-backend.local', 'Preferences backendPrefs', 'kBackendMdnsService[] = \\\"3c\\\"'):",
              "    assert token in PRIMARY, f'Recovered UI/mDNS contract missing: {token}'",
              "for token in ('123', 'ABC', 'NumericSymbols'):",
              "    assert token in KEYBOARD, f'Keyboard contract missing: {token}'",
              "assert 'PROBAR BACKEND' not in PRIMARY",
              "assert 'BACKEND DISPONIBLE' not in PRIMARY",
              "print('Recovered Sep-19 UI + production mDNS contract: PASS')",
          ]
          Path("tests/test_recovered_ui_contract.py").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Run restored UI contract
        run: python tests/test_recovered_ui_contract.py

      - name: Commit restoration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-sep19-ui.yml
          git add platformio/src/panel_4848s040/main.cpp src/main.cpp firmware/firmware-sync.json tests/test_recovered_ui_contract.py
          git commit -m 'firmware: restore Sep 19 WSL UI labels over final mDNS stack'
          git push origin HEAD:fix/restore-sep19-ui-mdns-pcu
