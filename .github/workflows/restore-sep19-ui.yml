name: Restore Sep19 UI

on:
  push:
    branches: ["fix/restore-sep19-ui-mdns-pcu"]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-sep19-ui-mdns-pcu
          fetch-depth: 0
      - name: Restore labels
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/BACKEND DISPONIBLE/WSL DISPONIBLE/g; s/PROBAR BACKEND/PROBAR WSL/g' platformio/src/panel_4848s040/main.cpp src/main.cpp
          cmp platformio/src/panel_4848s040/main.cpp src/main.cpp
          grep -Fq 'WSL DISPONIBLE' platformio/src/panel_4848s040/main.cpp
          grep -Fq 'PROBAR WSL' platformio/src/panel_4848s040/main.cpp
          grep -Fq 'ENVIAR 3C' platformio/src/panel_4848s040/main.cpp
          grep -Fq 'EDITAR ORDEN 3C' platformio/src/panel_4848s040/main.cpp
          grep -Fq 'CANCELAR' platformio/src/panel_4848s040/main.cpp
          grep -Fq '3c-backend.local' platformio/src/panel_4848s040/main.cpp
          grep -Fq 'NumericSymbols' include/virtual_keyboard.h
          ! grep -Fq 'PROBAR BACKEND' platformio/src/panel_4848s040/main.cpp
          ! grep -Fq 'BACKEND DISPONIBLE' platformio/src/panel_4848s040/main.cpp
          BLOB=$(git hash-object platformio/src/panel_4848s040/main.cpp)
          python -c "import json; p='firmware/firmware-sync.json'; d=json.load(open(p,encoding='utf-8')); d['git_blob_sha1']['platformio/src/panel_4848s040/main.cpp']='$BLOB'; d['git_blob_sha1']['src/main.cpp']='$BLOB'; d['imported_from']['note']='Integrated production mDNS/NVS discovery while preserving recovered 2026-09-19 WSL UI labels and keyboard. ERP main is authoritative for deployment.'; open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,ensure_ascii=False)+'\n')"
          printf '%s\n' "from pathlib import Path" "P=Path('platformio/src/panel_4848s040/main.cpp').read_text()" "M=Path('src/main.cpp').read_text()" "K=Path('include/virtual_keyboard.h').read_text()" "assert P == M" "assert all(x in P for x in ('WSL DISPONIBLE','PROBAR WSL','ENVIAR 3C','EDITAR ORDEN 3C','CANCELAR','3c-backend.local'))" "assert all(x in K for x in ('123','ABC','NumericSymbols'))" "assert 'PROBAR BACKEND' not in P and 'BACKEND DISPONIBLE' not in P" "print('Recovered UI + mDNS contract: PASS')" > tests/test_recovered_ui_contract.py
          python tests/test_recovered_ui_contract.py
      - name: Commit restored firmware contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-sep19-ui.yml
          git add platformio/src/panel_4848s040/main.cpp src/main.cpp firmware/firmware-sync.json tests/test_recovered_ui_contract.py
          git commit -m 'firmware: restore Sep 19 WSL UI over final mDNS stack'
          git push origin HEAD:fix/restore-sep19-ui-mdns-pcu
