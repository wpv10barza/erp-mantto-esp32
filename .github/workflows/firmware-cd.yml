name: Firmware CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Databricks-only backend contract
        uses: actions/checkout@v4
        with:
          repository: wpv10barza/asistente-de-databricks--erp
          ref: 1170ba2ab1b4918c66e25e3e1064547db8dea87a
          path: cloud

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify ERP firmware parity and Databricks cloud contract
        run: |
          python tests/test_firmware_main_sync.py
          python tests/test_backend_discovery.py
          python tests/test_production_firmware.py
          grep -q '/api/device/v1/health' cloud/app/main.py
          grep -q '/api/device/v1/commands' cloud/app/main.py
          grep -q 'requires_human_confirmation' cloud/app/main.py

      - name: Validate PCU launchers
        shell: bash
        run: |
          bash -n scripts/pcu-deploy.sh
          grep -q 'wpv10barza/erp-mantto-esp32.git' PCU-ERP-MANTTO-ESP32.ps1
          grep -q 'origin/main' PCU-ERP-MANTTO-ESP32.ps1
          grep -q 'firmware\\firmware-sync.json' PCU-ERP-MANTTO-ESP32.ps1
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("PCU-ERP-MANTTO-ESP32.ps1",[ref]$tokens,[ref]$errors) > $null; if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}'

      - name: Block 2 - tools
        env:
          REPO_DIR: ${{ github.workspace }}
        run: bash scripts/02_tools_guition.sh

      - name: Block 3 - verify
        env:
          REPO_DIR: ${{ github.workspace }}
        run: bash scripts/03_verify_guition.sh

      - name: Block 4 - ESPHome
        env:
          REPO_DIR: ${{ github.workspace }}
          BUILD_MODE: validate
        run: bash scripts/04_esphome_guition.sh

      - name: Install Databricks app dependencies
        run: pip install -r cloud/requirements.txt

      - name: Start Databricks-only FastAPI backend locally
        working-directory: cloud
        env:
          ESP32_API_TOKEN: ci-e2e-token
          ALLOW_INSECURE_DEVICE_API: "false"
          ALLOW_SHEET_WRITE: "false"
          DATABRICKS_APP_PORT: "3000"
        run: |
          nohup python app.py > ../cloud-app.log 2>&1 &
          echo $! > ../cloud-app.pid

      - name: Device API E2E against Databricks backend contract
        env:
          DEVICE_API_BASE_URL: http://127.0.0.1:3000
          ESP32_API_TOKEN: ci-e2e-token
        run: python tests/test_device_api_e2e.py

      - name: Stop local cloud backend
        if: always()
        run: |
          test ! -f cloud-app.pid || kill "$(cat cloud-app.pid)" || true
          test ! -f cloud-app.log || tail -100 cloud-app.log

      - name: Block 5 - native tests + firmware
        env:
          REPO_DIR: ${{ github.workspace }}
        run: bash scripts/05_platformio_guition.sh

      - name: Package production firmware and PCU
        run: |
          mkdir -p dist
          cp .pio/build/panel_4848s040/firmware.bin dist/
          cp .pio/build/panel_4848s040/bootloader.bin dist/
          cp .pio/build/panel_4848s040/partitions.bin dist/
          cp .pio/build/panel_4848s040/firmware.elf dist/
          cp PCU-ERP-MANTTO-ESP32.ps1 dist/
          cp scripts/pcu-deploy.sh dist/
          cp firmware/firmware-sync.json dist/
          cp contract/device-command-v1.json dist/
          printf '%s\n' '0x0000 bootloader.bin' '0x8000 partitions.bin' '0x10000 firmware.bin' > dist/flash-layout.txt
          printf '{"source_sha":"%s","environment":"panel_4848s040","build_type":"release","production":true,"flash_target":"ESP32-S3-4848S040","authoritative_repository":"wpv10barza/erp-mantto-esp32","authoritative_branch":"main","backend_repository":"wpv10barza/asistente-de-databricks--erp","backend_commit":"1170ba2ab1b4918c66e25e3e1064547db8dea87a","validation":"compiled_not_physically_flashed"}\n' "${GITHUB_SHA}" > dist/manifest.json
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: erp-mantto-esp32-4848-databricks-production
          path: dist/
          if-no-files-found: error
