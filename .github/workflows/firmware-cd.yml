name: Firmware CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_databricks:
        description: "Publicar release OTA verificada en UC Volume"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Databricks-only backend contract
        uses: actions/checkout@v4
        with:
          repository: wpv10barza/asistente-de-databricks--erp
          ref: a042ac350b970707fc54c1a9b37cbe83a5864129
          path: cloud

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify ERP firmware parity and Databricks cloud contract
        run: |
          python tests/test_firmware_main_sync.py
          python tests/test_backend_discovery.py
          python tests/test_final_ui_contract.py
          python tests/test_voice_cloud_contract.py
          python tests/test_ota_commit_contract.py
          python tests/test_history_ui_contract.py
          python tests/test_async_white_ui_contract.py
          python tests/test_production_firmware.py
          grep -q '/api/device/v1/health' cloud/app/main.py
          grep -q '/api/device/v1/commands' cloud/app/main.py
          grep -q 'requires_human_confirmation' cloud/app/main.py
          grep -q 'get_device_history_panel' cloud/app/main.py
          grep -q 'firmware_by_commit' cloud/app/main.py
          grep -q 'device_cloud_verify' cloud/app/main.py
          grep -q 'voice_panel_inbox' cloud/app/main.py

      - name: Validate PCU launchers
        shell: bash
        run: |
          bash -n scripts/pcu-deploy.sh
          grep -q 'wpv10barza/erp-mantto-esp32.git' PCU-ERP-MANTTO-ESP32.ps1
          grep -q 'origin/main' PCU-ERP-MANTTO-ESP32.ps1
          grep -q 'firmware\\firmware-sync.json' PCU-ERP-MANTTO-ESP32.ps1
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("PCU-ERP-MANTTO-ESP32.ps1",[ref]$tokens,[ref]$errors) > $null; if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}'

      - name: Block 2 - tools
        env:
          REPO_DIR: ${{ github.workspace }}
        run: bash scripts/02_tools_guition.sh

      - name: Block 3 - verify
        env:
          REPO_DIR: ${{ github.workspace }}
        run: bash scripts/03_verify_guition.sh

      - name: Block 4 - ESPHome
        env:
          REPO_DIR: ${{ github.workspace }}
          BUILD_MODE: validate
        run: bash scripts/04_esphome_guition.sh

      - name: Install Databricks app dependencies
        run: pip install -r cloud/requirements.txt

      - name: Backend historical audit tests
        working-directory: cloud
        run: python -m pytest -q tests/test_history.py tests/test_voice_3c.py

      - name: Start Databricks-only FastAPI backend locally
        working-directory: cloud
        env:
          ESP32_API_TOKEN: ci-e2e-token
          ALLOW_INSECURE_DEVICE_API: "false"
          ALLOW_SHEET_WRITE: "false"
          DATABRICKS_APP_PORT: "3000"
        run: |
          nohup python app.py > ../cloud-app.log 2>&1 &
          echo $! > ../cloud-app.pid

      - name: Device API E2E against Databricks backend contract
        env:
          DEVICE_API_BASE_URL: http://127.0.0.1:3000
          ESP32_API_TOKEN: ci-e2e-token
        run: python tests/test_device_api_e2e.py

      - name: Stop local cloud backend
        if: always()
        run: |
          test ! -f cloud-app.pid || kill "$(cat cloud-app.pid)" || true
          test ! -f cloud-app.log || tail -100 cloud-app.log

      - name: Block 5 - native tests + firmware
        env:
          REPO_DIR: ${{ github.workspace }}
        run: bash scripts/05_platformio_guition.sh

      - name: Package production firmware and PCU
        run: |
          mkdir -p dist
          cp .pio/build/panel_4848s040/firmware.bin dist/
          cp .pio/build/panel_4848s040/bootloader.bin dist/
          cp .pio/build/panel_4848s040/partitions.bin dist/
          cp .pio/build/panel_4848s040/firmware.elf dist/
          cp PCU-ERP-MANTTO-ESP32.ps1 dist/
          cp scripts/pcu-deploy.sh dist/
          cp firmware/firmware-sync.json dist/
          cp contract/device-command-v1.json dist/
          printf '%s\n' '0x0000 bootloader.bin' '0x8000 partitions.bin' '0x10000 firmware.bin' > dist/flash-layout.txt
          python scripts/package_ota_metadata.py
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: erp-mantto-esp32-4848-databricks-production
          path: dist/
          if-no-files-found: error

  publish_ota:
    name: Publish verified OTA to Databricks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_databricks }}
    needs: [firmware]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      OTA_VOLUME_PATH: ${{ vars.OTA_VOLUME_PATH }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: erp-mantto-esp32-4848-databricks-production
          path: dist

      - name: Check channel, source SHA and release metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_CLIENT_ID"
          [[ "$OTA_VOLUME_PATH" =~ ^/Volumes/[^/]+/[^/]+/[^/]+$ ]]
          python - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path("dist")
          release=json.loads((p/"manifest.json").read_text())
          latest=json.loads((p/"latest.json").read_text())
          assert release["source_sha"]==os.environ["GITHUB_SHA"]
          assert release["source_repository"]=="wpv10barza/erp-mantto-esp32"
          assert release["hardware"]=="ESP32-S3-4848S040"
          assert release["partition_table"]=="partitions_ota_16mb.csv"
          assert release["credential_mode"]=="ota3c-nvs"
          assert latest["version"]==release["version"]
          data=(p/"firmware.bin").read_bytes()
          assert len(data)==release["size"]==latest["size"]
          assert hashlib.sha256(data).hexdigest()==release["sha256"]==latest["sha256"]
          open(os.environ["GITHUB_ENV"],"a").write("OTA_VERSION="+release["version"]+"\n")
          PY

      - name: Databricks CLI
        uses: databricks/setup-cli@main

      - name: Publish immutable release, update latest last
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dbfs:$OTA_VOLUME_PATH/stable"
          VERSION_DIR="$ROOT/$OTA_VERSION"
          databricks fs mkdir "$ROOT"
          databricks fs mkdir "$VERSION_DIR"
          databricks fs cp dist/firmware.bin "$VERSION_DIR/firmware.bin" --overwrite
          databricks fs cp dist/manifest.json "$VERSION_DIR/manifest.json" --overwrite
          databricks fs cp dist/latest.json "$ROOT/latest.json" --overwrite
          databricks fs cat "$ROOT/latest.json"
