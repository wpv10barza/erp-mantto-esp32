name: Build ESP32 OTA Candidate
on:
  pull_request:
    paths:
      - "platformio.ini"
      - "partitions_ota_16mb.csv"
      - "platformio/src/**"
      - "include/**"
      - "src/main.cpp"
      - "tests/test_ota_manual_contract.py"
      - ".github/workflows/ota-firmware-build.yml"
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Commit SHA completo (40 hex); vacio = HEAD elegido"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate requested source SHA
        env:
          REQUESTED_COMMIT: ${{ github.event.inputs.source_commit }}
        run: |
          if [ -n "$REQUESTED_COMMIT" ]; then
            [[ "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "Se requiere SHA Git completo de 40 hex" >&2
              exit 1
            }
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Verify OTA source, mirrored production firmware and partitions
        run: |
          python tests/test_ota_manual_contract.py
          python tests/test_firmware_main_sync.py
          python tests/test_production_firmware.py
      - name: Compile production ESP32-S3 4848S040 with OTA partitions
        run: pio run -e panel_4848s040
      - name: Verify binaries and image size
        run: |
          test -s .pio/build/panel_4848s040/firmware.bin
          test -s .pio/build/panel_4848s040/partitions.bin
          test -s .pio/build/panel_4848s040/bootloader.bin
          python - <<'PY'
          from pathlib import Path
          firmware = Path('.pio/build/panel_4848s040/firmware.bin')
          assert 0 < firmware.stat().st_size <= 0x400000
          print('OTA production firmware bytes:', firmware.stat().st_size)
          PY
      - name: Record exact source commit and firmware digest
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          file = Path(".pio/build/panel_4848s040/firmware.bin")
          metadata = {
              "git_commit_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "sha256": hashlib.sha256(file.read_bytes()).hexdigest(),
              "size": file.stat().st_size,
              "board": "ESP32-S3-4848S040",
              "partition_csv": "partitions_ota_16mb.csv",
              "provisioned": False,
              "publishable_ota_release": False,
          }
          Path("ota-candidate-provenance.json").write_text(
              json.dumps(metadata, indent=2) + "\\n", encoding="utf-8"
          )
          print("Source commit:", metadata["git_commit_sha"])
          print("Firmware SHA256:", metadata["sha256"])
          PY
      - name: Upload unsigned, unprovisioned build for review only
        uses: actions/upload-artifact@v4
        with:
          name: ota-candidate-esp32-s3-4848s040
          path: |
            .pio/build/panel_4848s040/firmware.bin
            .pio/build/panel_4848s040/bootloader.bin
            .pio/build/panel_4848s040/partitions.bin
            ota-candidate-provenance.json
          if-no-files-found: error
