name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Validate six Bash blocks
        run: |
          set -euo pipefail
          for f in scripts/01_clone_guition.sh                    scripts/02_tools_guition.sh                    scripts/03_verify_guition.sh                    scripts/04_esphome_guition.sh                    scripts/05_platformio_guition.sh                    scripts/06_flash_monitor_guition.sh; do
            bash -n "$f"
          done

      - name: Verify project
        run: REPO_DIR="${{ github.workspace }}" bash scripts/03_verify_guition.sh

      - name: PlatformIO native tests
        run: |
          set -euo pipefail
          pio test -e native 2>&1 | tee native-test.log
          if grep -q '\[SKIPPED\]' native-test.log; then
            echo "ERROR: PlatformIO reported skipped native tests."
            grep '\[SKIPPED\]' native-test.log
            exit 1
          fi

          required_suites=(
            "native:test_backend_command_buffer"
            "native:test_command_text_viewport"
            "native:test_virtual_keyboard"
            "native:test_editor_components"
            "native:test_touch_gpio_ui"
          )

          for suite in "${required_suites[@]}"; do
            if ! grep -Eq -- "native:${suite#native:}[[:space:]]+\[?PASSED\]?" native-test.log; then
              echo "ERROR: Required native test suite did not report PASSED: ${suite}"
              grep -E -- "native:${suite#native:}" native-test.log || true
              exit 1
            fi
          done

      - name: Python contracts
        run: |
          python tests/test_panel_state_contract.py
          python tests/test_final_ui_contract.py
          python tests/test_ota_manual_contract.py
          python tests/test_ota_release_2_5_1.py
          python tests/test_async_white_ui_contract.py
          python tests/test_wifi_source.py
          python tests/test_command_editor_integration.py
          python tests/test_touch_gpio_contract.py
          python test/command_buffer_regression.py
          python tests/test_production_firmware.py
