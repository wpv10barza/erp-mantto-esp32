name: Import source firmware snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import exact source tree
        shell: bash
        env:
          SOURCE_REPO: https://github.com/wpv10barza/ESP32-S3-4848S040.git
          SOURCE_REF: 4ef0e9a6bd55a3a935d14ae8d84aa8d290114b53
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/source
          git clone --no-checkout "$SOURCE_REPO" /tmp/source
          git -C /tmp/source checkout --detach "$SOURCE_REF"
          test "$(git -C /tmp/source rev-parse HEAD)" = "$SOURCE_REF"
          git -C /tmp/source archive --format=tar "$SOURCE_REF" -o /tmp/source.tar
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf /tmp/source.tar -C .
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: import ESP32 firmware source snapshot"
          git push origin HEAD:main